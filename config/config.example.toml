# Ask Omar configuration. Installed as ~/.config/ask-omar/config.toml.

[agent]
# Pi is the local headless assistant backend.
backend = "pi"
# Leave provider/model empty on first install. Ask Omar fills them from Pi's
# defaults (or the first model Pi lists) when you run setup / open Settings.
provider = ""
model = ""
thinking = "low"
# Settings → Safety names in brackets.
# ask: show each command; optionally allow routine commands for 15 minutes [Ask First] (default)
# off: no model-generated shell commands; read-only file tools remain [Block Commands]
# full: run routine commands automatically; ask about recognized high-risk commands [Ask for Recognized Risks]
# unrestricted: run every command without asking; dangerous [Always Allow — Dangerous]
system_access = "ask"
timeout_seconds = 90

[conversation]
# A new in-memory Pi conversation starts after this many idle minutes.
# Set to 0 to keep the conversation until New, service restart, or failure.
idle_timeout_minutes = 30

[history]
# Local request/response records available under Settings → Past answers.
limit = 100

# UI settings such as width and multi-monitor placement are stored by Omarchy
# on the widget entry in ~/.config/omarchy/shell.json.
