name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check Node TypeScript execution
        run: |
          printf '%s\n' 'const value: string = "ready"; if (value !== "ready") process.exit(1);' > /tmp/ask-omar-node-probe.ts
          node /tmp/ask-omar-node-probe.ts
      - name: Test
        run: PYTHONPATH=service python -m unittest discover -s tests -v
